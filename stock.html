<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Electro Variety — Stock</title>
<style>
body{margin:0;background:#eef0f3;font-family:Arial,sans-serif;color:#111827}header{background:#111827;color:#fff;padding:15px;font-weight:900}.wrap{max-width:850px;margin:auto;padding:16px}.card{background:#fff;border-radius:15px;padding:18px;margin-bottom:15px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.button-link{display:inline-block;text-decoration:none;border-radius:9px;padding:11px 15px;font-weight:900}.blue{background:#2563eb;color:#fff}.dark{background:#111827;color:#fff}.red{background:#fee2e2;color:#991b1b}.hidden{display:none}.small{font-size:12px;color:#6b7280}.status{margin-top:9px;font-size:13px}.stock-list{margin-top:12px}.stock-row{display:flex;gap:10px;align-items:center;border:1px solid #e5e7eb;border-radius:10px;padding:10px;margin-top:8px;background:#fff}.stock-row .info{flex:1;min-width:0}.stock-row .cat{font-size:12px;color:#6b7280;margin-top:3px}.stock-input{width:90px;padding:11px;border:1px solid #d1d5db;border-radius:9px;text-align:center;font-size:16px;font-weight:900;box-sizing:border-box}.stock-save{white-space:nowrap}.out-row{border-color:#fecaca;background:#fffafa}.search{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:9px;box-sizing:border-box;font-size:15px}.summary{margin-top:9px;font-size:12px;color:#6b7280}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}@media(max-width:600px){.stock-row{align-items:flex-start;flex-wrap:wrap}.stock-row .info{flex:1 1 100%}.stock-input{width:100px}.stock-save{flex:1}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
</head>
<body>
<header>📦 ELECTRO VARIETY · STOCK <button id="logout" class="red hidden" style="float:right" type="button">Cerrar sesión</button></header>
<div id="login" class="card" style="max-width:420px;margin:50px auto"><h2>Acceso administrador</h2><label>Email</label><input id="email" type="email" autocomplete="username" style="width:100%;padding:11px;box-sizing:border-box;border:1px solid #d1d5db;border-radius:9px;margin-top:5px"><label style="display:block;margin-top:10px">Contraseña</label><input id="password" type="password" autocomplete="current-password" style="width:100%;padding:11px;box-sizing:border-box;border:1px solid #d1d5db;border-radius:9px;margin-top:5px"><button id="loginButton" class="blue" style="width:100%;margin-top:13px;border:0;border-radius:9px;padding:12px;font-weight:900" type="button">🔐 Ingresar</button><div id="loginMsg" class="status"></div></div>
<div id="app" class="wrap hidden">
  <div class="card">
    <div class="section-title"><div><h2 style="margin:0">📦 Control de stock</h2><div class="small" style="margin-top:5px">Categorías y productos ordenados automáticamente de A a Z.</div></div><a class="button-link dark" href="admin.html">⚙️ Volver al administrador</a></div>
    <div class="actions"><input id="stockSearch" class="search" type="search" placeholder="🔎 Buscar producto o categoría" autocomplete="off"><button id="stockSaveAllButton" class="blue" type="button">💾 Guardar todo</button></div>
    <div id="stockStatus" class="summary"></div><div id="stockList" class="stock-list">Cargando…</div>
  </div>
</div>
<script>
"use strict";
(function(){
  if(typeof window.supabase==="undefined"){document.body.innerHTML='<div style="padding:20px;font-family:Arial"><b>Error:</b> No se pudo cargar Supabase JS.</div>';return;}
  if(typeof window.EV_CONFIG==="undefined"||!EV_CONFIG.SUPABASE_URL||!EV_CONFIG.SUPABASE_ANON_KEY){document.body.innerHTML='<div style="padding:20px;font-family:Arial"><b>Error:</b> Falta config.js.</div>';return;}
  const db=supabase.createClient(EV_CONFIG.SUPABASE_URL,EV_CONFIG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:"electro-variety-admin-auth"}});
  const $=id=>document.getElementById(id);
  const esc=v=>String(v??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;", "'":"&#039;"}[ch]));
  const clean=v=>String(v??"").replace(/[\u200B-\u200D\u200E\u200F\u202A-\u202E\u2060\u2066-\u2069\uFEFF]/g,"").trim();
  const key=v=>clean(v).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/^[^\p{L}\p{N}]+/u,"").toLocaleLowerCase("es");
  const collator=new Intl.Collator("es",{numeric:true,sensitivity:"base",ignorePunctuation:true});
  let products=[];
  function sortAZ(arr){return [...arr].sort((a,b)=>{let c=collator.compare(key(a.category||"Sin categoría"),key(b.category||"Sin categoría"));if(c)return c;c=collator.compare(key(a.name),key(b.name));if(c)return c;return Number(a.id||0)-Number(b.id||0);});}
  function status(text,cls=""){const e=$("stockStatus");e.textContent=text||"";e.className="summary"+(cls?" "+cls:"");}
  function showLogin(msg=""){$("login").classList.remove("hidden");$("app").classList.add("hidden");$("logout").classList.add("hidden");$("loginMsg").textContent=msg;}
  function showApp(){$("login").classList.add("hidden");$("app").classList.remove("hidden");$("logout").classList.remove("hidden");}
  async function verifyAdmin(session){if(!session){showLogin();return false;}const {data,error}=await db.from("admin_profiles").select("user_id,role").eq("user_id",session.user.id).eq("role","admin").maybeSingle();if(error||!data){await db.auth.signOut();showLogin("Esta cuenta no tiene acceso al panel de stock.");return false;}showApp();await load();return true;}
  async function login(){const email=$("email").value.trim(),password=$("password").value;$("loginButton").disabled=true;$("loginMsg").textContent="Ingresando…";try{const {data,error}=await db.auth.signInWithPassword({email,password});if(error||!data?.session){$("loginMsg").textContent=error?.message||"No se pudo iniciar sesión.";return;}await verifyAdmin(data.session);}catch(e){$("loginMsg").textContent="No se pudo iniciar sesión.";}finally{$("loginButton").disabled=false;}}
  async function load(){const {data,error}=await db.from("products").select("id,name,category,stock,active");if(error){$("stockList").textContent="No se pudo cargar el stock: "+error.message;status("Si aparece un error de columna, ejecutá la migración de stock en Supabase.","red");return;}products=sortAZ(data||[]);render();}
  function render(){const q=clean($("stockSearch").value).toLocaleLowerCase("es");const rows=products.filter(p=>!q||`${p.name||""} ${p.category||""}`.toLocaleLowerCase("es").includes(q));status(`Mostrando ${rows.length} de ${products.length} productos.`);if(!rows.length){$("stockList").innerHTML='<div class="small">No se encontraron productos.</div>';return;}$("stockList").innerHTML=rows.map(p=>{const s=Math.max(0,Number.isFinite(Number(p.stock))?Math.floor(Number(p.stock)):0);return `<div class="stock-row ${s===0?"out-row":""}" data-id="${Number(p.id)}"><div class="info"><b>${esc(p.name)}</b><div class="cat">${esc(p.category||"Sin categoría")} · ${p.active!==false?"🟢 Publicado":"⚪ Oculto"}</div></div><input class="stock-input" data-input type="number" min="0" step="1" value="${s}" aria-label="Stock de ${esc(p.name)}"><button class="blue stock-save" data-save type="button">Guardar</button></div>`;}).join("");$("stockList").querySelectorAll("[data-save]").forEach(btn=>btn.addEventListener("click",()=>saveOne(btn.closest(".stock-row"))));}
  async function saveOne(row){const id=Number(row.dataset.id),input=row.querySelector("[data-input]"),value=Math.floor(Number(input.value));if(!Number.isFinite(value)||value<0){alert("El stock debe ser un número entero igual o mayor a 0.");input.value="0";return;}input.disabled=true;try{const {error}=await db.from("products").update({stock:value}).eq("id",id);if(error)throw error;const p=products.find(x=>Number(x.id)===id);if(p)p.stock=value;status(`Stock actualizado: ${p?.name||"producto"} → ${value} unidades.`);row.classList.toggle("out-row",value===0);}catch(e){status("No se pudo guardar: "+e.message,"red");}finally{input.disabled=false;}}
  async function saveAll(){const rows=[...document.querySelectorAll("[data-id]")];const changes=[];for(const row of rows){const value=Math.floor(Number(row.querySelector("[data-input]")?.value));if(!Number.isFinite(value)||value<0){alert("Todos los stocks deben ser números enteros iguales o mayores a 0.");return;}changes.push({id:Number(row.dataset.id),stock:value});}const btn=$("stockSaveAllButton");btn.disabled=true;status("Guardando stocks…");try{for(const x of changes){const {error}=await db.from("products").update({stock:x.stock}).eq("id",x.id);if(error)throw error;const p=products.find(y=>Number(y.id)===x.id);if(p)p.stock=x.stock;}status(`Stock actualizado para ${changes.length} productos.`);render();}catch(e){status("No se pudieron guardar todos los stocks: "+e.message,"red");}finally{btn.disabled=false;}}
  $("loginButton").addEventListener("click",login);$("password").addEventListener("keydown",e=>{if(e.key==="Enter")login();});$("stockSearch").addEventListener("input",render);$("stockSaveAllButton").addEventListener("click",saveAll);$("logout").addEventListener("click",async()=>{await db.auth.signOut();showLogin("Sesión cerrada.");});
  db.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT")showLogin();else if((event==="SIGNED_IN"||event==="INITIAL_SESSION"||event==="TOKEN_REFRESHED")&&session)setTimeout(()=>verifyAdmin(session),0);});
  (async()=>{const {data}=await db.auth.getSession();if(data?.session)await verifyAdmin(data.session);else showLogin();})();
})();
</script>
</body>
</html>
