<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Electro Variety — Administrador</title>
<style>
body{margin:0;background:#eef0f3;font-family:Arial,sans-serif;color:#111827}header{background:#111827;color:#fff;padding:15px;font-weight:900}.wrap{max-width:850px;margin:auto;padding:16px}.card{background:#fff;border-radius:15px;padding:18px;margin-bottom:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{font-size:12px;font-weight:900}input{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;margin-top:5px;box-sizing:border-box}button{border:0;border-radius:9px;padding:11px 15px;font-weight:900;cursor:pointer}.blue{background:#2563eb;color:#fff}.red{background:#fee2e2;color:#991b1b}.dark{background:#111827;color:#fff}.hidden{display:none}.item{display:flex;gap:10px;align-items:center;border:1px solid #e5e7eb;border-radius:10px;padding:10px;margin-top:8px}.thumb{width:58px;height:58px;object-fit:cover;border-radius:8px}.info{flex:1;min-width:0}.small{font-size:12px;color:#6b7280}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.seller-form{background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin-top:10px}.seller-status{margin-top:9px}.seller-actions{display:flex;gap:7px;flex-wrap:wrap}.badge{font-size:11px;font-weight:900;padding:4px 7px;border-radius:999px;background:#e5e7eb}#login{max-width:420px;margin:50px auto}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.item{align-items:flex-start}.item button{padding:9px;font-size:12px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
</head>
<body>
<header>⚙️ ELECTRO VARIETY · ADMINISTRADOR <button id="logout" class="red hidden" style="float:right" type="button">Cerrar sesión</button></header>
<div id="login" class="card"><h2>Acceso administrador</h2><label>Email</label><input id="email" type="email" autocomplete="username"><label style="display:block;margin-top:10px">Contraseña</label><input id="password" type="password" autocomplete="current-password"><button id="loginButton" class="blue" style="width:100%;margin-top:13px" type="button">🔐 Ingresar</button><div id="loginMsg" class="small" style="margin-top:9px"></div></div>
<div id="app" class="wrap hidden">
  <div class="card"><h2 id="formTitle">Nuevo producto</h2><div class="grid">
    <div class="full"><label>Nombre</label><input id="name"></div><div><label>Subtítulo</label><input id="subtitle"></div><div><label>Categoría</label><input id="category"></div>
    <div><label>Cuota quincenal</label><input id="qprice"></div><div><label>Cantidad quincenal</label><input id="qcount" type="number" min="1"></div><div><label>Cuota mensual</label><input id="mprice"></div><div><label>Cantidad mensual</label><input id="mcount" type="number" min="1"></div>
    <div class="full"><label>Imagen (obligatoria al crear; opcional al editar)</label><input id="image" type="file" accept="image/*"></div>
  </div><div class="actions"><button class="blue" id="saveButton" type="button">💾 Guardar</button><button class="dark" id="resetButton" type="button">Nuevo / cancelar edición</button></div><div id="status" class="small"></div></div>
  <div class="card"><h2>Productos</h2><div id="list">Cargando…</div></div>
  <div class="card"><h2>👥 Vendedores</h2><div class="seller-form"><div class="grid">
    <div><label>Nombre del vendedor</label><input id="sellerName" placeholder="Ej. Juan Pérez"></div>
    <div><label>Número de WhatsApp / celular</label><input id="sellerPhone" type="tel" inputmode="numeric" autocomplete="off" placeholder="2224534328"></div>
    <div><label>Contraseña inicial</label><input id="sellerPassword" type="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres"></div>
  </div><div class="actions"><button class="blue" id="createSellerButton" type="button">➕ Crear vendedor</button></div><div id="sellerStatus" class="small seller-status"></div></div><div id="sellerList" style="margin-top:14px">Cargando…</div></div>
</div>
<script>
"use strict";
const db=supabase.createClient(EV_CONFIG.SUPABASE_URL,EV_CONFIG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:"electro-variety-admin-auth"}});
let editing=null,checking=false;
const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));const normalizePhone=v=>String(v??"").replace(/\D/g,"");
function showLogin(msg=""){$("login").classList.remove("hidden");$("app").classList.add("hidden");$("logout").classList.add("hidden");$("loginMsg").textContent=msg}
function showApp(){$("login").classList.add("hidden");$("app").classList.remove("hidden");$("logout").classList.remove("hidden");loadProducts();loadSellers()}
async function verifyAdmin(session){if(!session||checking)return;checking=true;try{const {data,error}=await db.from("admin_profiles").select("user_id,role").eq("user_id",session.user.id).eq("role","admin").maybeSingle();if(error||!data){await db.auth.signOut();showLogin("Esta cuenta no tiene permisos de administrador.");return}showApp()}finally{checking=false}}
async function login(){const email=$("email").value.trim();const password=$("password").value;if(!email||!password){$("loginMsg").textContent="Completá email y contraseña.";return}$("loginButton").disabled=true;$("loginMsg").textContent="Ingresando…";try{const {data,error}=await db.auth.signInWithPassword({email,password});if(error||!data?.session){$("loginMsg").textContent=error?.message||"No se pudo iniciar sesión.";return}await verifyAdmin(data.session)}catch(e){$("loginMsg").textContent="No se pudo iniciar sesión."}finally{$("loginButton").disabled=false}}
async function signout(){await db.auth.signOut();showLogin("Sesión cerrada.")}
async function loadProducts(){const {data,error}=await db.from("products").select("*").order("id",{ascending:false});if(error){$("list").textContent="Error: "+error.message;return}if(!data?.length){$("list").textContent="No hay productos.";return}$("list").innerHTML=data.map(p=>`<div class="item"><img class="thumb" src="${esc(p.image_url)}" alt=""><div class="info"><b>${esc(p.name)}</b><div class="small">${esc(p.category||"")} · ${esc(p.q_price)} × ${p.q_count} · ${esc(p.m_price)} × ${p.m_count} · ${p.active?"🟢 Publicado":"⚪ Oculto"}</div></div><button type="button" onclick="editProduct(${p.id})">✏️</button><button type="button" class="${p.active?"red":"blue"}" onclick="toggleProduct(${p.id},${p.active})">${p.active?"Ocultar":"Publicar"}</button></div>`).join("")}
async function loadSellers(){const box=$("sellerList");box.textContent="Cargando vendedores…";const {data,error}=await db.from("seller_profiles").select("user_id,name,phone,active,created_at").order("created_at",{ascending:false});if(error){box.textContent="Error: "+error.message;return}if(!data?.length){box.innerHTML='<div class="small">Todavía no hay vendedores creados.</div>';return}box.innerHTML=data.map(s=>`<div class="item"><div class="info"><b>${esc(s.name)}</b><div class="small">📱 ${esc(s.phone||"Sin número")} · ${s.active?"🟢 Acceso habilitado":"🔴 Acceso bloqueado"}</div></div><div class="seller-actions"><button type="button" class="${s.active?"red":"blue"}" onclick="toggleSeller('${s.user_id}',${s.active})">${s.active?"Desactivar":"Activar"}</button><button type="button" class="red" onclick="deleteSeller('${s.user_id}')">🗑️ Eliminar</button></div></div>`).join("")}
async function createSeller(){const name=$("sellerName").value.trim(),phone=normalizePhone($("sellerPhone").value),password=$("sellerPassword").value;if(!name||!phone||!password){$("sellerStatus").textContent="Completá nombre, número y contraseña.";return}if(phone.length<8){$("sellerStatus").textContent="Ingresá un número de celular válido.";return}if(password.length<6){$("sellerStatus").textContent="La contraseña debe tener al menos 6 caracteres.";return}$("createSellerButton").disabled=true;$("sellerStatus").textContent="Creando vendedor…";try{const {data,error}=await db.functions.invoke("create-seller",{body:{name,phone,password}});if(error){let msg=error.message||"No se pudo crear el vendedor";try{if(error.context){const b=await error.context.json();if(b?.error)msg=b.error}}catch(_){}$("sellerStatus").textContent="Error: "+msg;return}if(data?.error){$("sellerStatus").textContent="Error: "+data.error;return}$("sellerStatus").textContent="✅ Vendedor creado correctamente.";$("sellerName").value="";$("sellerPhone").value="";$("sellerPassword").value="";await loadSellers()}finally{$("createSellerButton").disabled=false}}
async function toggleSeller(userId,active){if(!confirm(`¿Querés ${active?"desactivar":"activar"} este vendedor?`))return;const {error}=await db.from("seller_profiles").update({active:!active}).eq("user_id",userId);if(error){alert("No se pudo cambiar el acceso: "+error.message);return}await loadSellers()}
async function deleteSeller(userId){if(!confirm("¿Eliminar definitivamente este vendedor?\n\nSe eliminará su cuenta de acceso y su perfil. Esta acción no se puede deshacer."))return;$("sellerStatus").textContent="Eliminando vendedor…";try{const {data,error}=await db.functions.invoke("delete-seller",{body:{userId}});if(error){let msg=error.message||"No se pudo eliminar el vendedor";try{if(error.context){const b=await error.context.json();if(b?.error)msg=b.error}}catch(_){}$("sellerStatus").textContent="Error: "+msg;return}if(data?.error){$("sellerStatus").textContent="Error: "+data.error;return}$("sellerStatus").textContent="🗑️ Vendedor eliminado correctamente.";await loadSellers()}catch(e){$("sellerStatus").textContent="No se pudo eliminar el vendedor."}}
async function save(){const name=$("name").value.trim(),qprice=$("qprice").value.trim(),qcount=Number($("qcount").value),mprice=$("mprice").value.trim(),mcount=Number($("mcount").value);if(!name||!qprice||!qcount||!mprice||!mcount){$("status").textContent="Completá nombre y ambas financiaciones.";return}let imageUrl=editing?.image_url||"";const f=$("image").files[0];if(f){$("status").textContent="Subiendo imagen…";const ext=(f.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg",path=`${crypto.randomUUID()}.${ext}`;const up=await db.storage.from("product-images").upload(path,f,{upsert:false});if(up.error){$("status").textContent="Error de imagen: "+up.error.message;return}imageUrl=db.storage.from("product-images").getPublicUrl(path).data.publicUrl}if(!imageUrl){$("status").textContent="Elegí una imagen.";return}const row={name,subtitle:$("subtitle").value.trim(),category:$("category").value.trim()||"Producto",q_price:qprice,q_count:qcount,m_price:mprice,m_count:mcount,image_url:imageUrl,active:true,updated_at:new Date().toISOString()};const res=editing?await db.from("products").update(row).eq("id",editing.id):await db.from("products").insert(row);$("status").textContent=res.error?"Error: "+res.error.message:"Guardado online correctamente.";if(!res.error){resetForm();await loadProducts()}}
async function editProduct(id){const {data,error}=await db.from("products").select("*").eq("id",id).single();if(error){alert(error.message);return}editing=data;$("formTitle").textContent="Editar producto";$("name").value=data.name||"";$("subtitle").value=data.subtitle||"";$("category").value=data.category||"";$("qprice").value=data.q_price||"";$("qcount").value=data.q_count||"";$("mprice").value=data.m_price||"";$("mcount").value=data.m_count||"";window.scrollTo({top:0,behavior:"smooth"})}
function resetForm(){editing=null;$("formTitle").textContent="Nuevo producto";["name","subtitle","category","qprice","qcount","mprice","mcount"].forEach(id=>$(id).value="");$("image").value="";$("status").textContent=""}
async function toggleProduct(id,active){const {error}=await db.from("products").update({active:!active,updated_at:new Date().toISOString()}).eq("id",id);if(error)alert(error.message);else await loadProducts()}
$("loginButton").addEventListener("click",login);$("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});$("logout").addEventListener("click",signout);$("saveButton").addEventListener("click",save);$("resetButton").addEventListener("click",resetForm);$("createSellerButton").addEventListener("click",createSeller);
db.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT")showLogin();else if(event==="SIGNED_IN"||event==="INITIAL_SESSION"||event==="TOKEN_REFRESHED"){if(session)setTimeout(()=>verifyAdmin(session),0)}});
(async function boot(){try{const {data,error}=await db.auth.getSession();if(error){showLogin("No se pudo recuperar la sesión.");return}if(data?.session)await verifyAdmin(data.session);else showLogin()}catch(e){showLogin("No se pudo recuperar la sesión.")}})();
</script>
</body>
</html>
