<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Electro Variety — Catálogo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9ecef;font-family:Arial,sans-serif;color:#111827}
header{background:#111827;color:#fff;padding:13px 15px;position:sticky;top:0;z-index:20}
.head{max-width:760px;margin:auto;display:flex;align-items:center}.brand{font-weight:900;flex:1}.counter{font-size:13px}
.tools{max-width:760px;margin:9px auto 0;display:flex;gap:7px}.tools input,.tools select{min-width:0;flex:1;padding:10px;border:0;border-radius:9px;font-size:14px}.tools select{max-width:190px}
main{max-width:760px;margin:auto;background:#fff;min-height:calc(100vh - 100px);padding:18px}
.msg{text-align:center;padding:45px 10px;color:#6b7280}.brand2{text-align:center;font-size:25px;font-weight:900}.tag{text-align:center;color:#6b7280;font-size:11px;margin:3px 0 15px}
.category{width:max-content;margin:auto;background:#111827;color:#fff;border-radius:20px;padding:7px 17px;font-size:12px;font-weight:900}
h1{text-align:center;color:#2563eb;font-size:24px;line-height:1.15}.img{width:100%;display:block;border-radius:10px}
.finance{padding:6px 4px 2px;margin-top:15px}.row{padding:5px 0;font-size:20px;font-weight:700}.value{font-weight:900}.prodtitle{text-align:left;color:#111827;font-size:27px;line-height:1.2;font-weight:900;margin:16px 0 10px}
.share{width:100%;border:0;border-radius:999px;background:#25D366;color:#fff;padding:15px;font-size:16px;font-weight:900;margin-top:15px}.nav{display:flex;gap:8px;margin-top:10px}.nav button{flex:1;padding:11px;border:0;border-radius:9px;background:#111827;color:#fff;font-weight:900}.nav button:disabled{opacity:.3}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
</head>
<body>
<header><div class="head"><div class="brand">ELECTRO VARIETY · CATÁLOGO</div><div id="counter" class="counter">—</div></div>
<div class="tools"><input id="search" placeholder="🔎 Buscar producto"><select id="category"><option value="">Todas las categorías</option></select></div></header>
<main id="app"><div class="msg">Cargando catálogo…</div></main>
<script>
let db,all=[],shown=[],pos=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const money=v=>{const raw=String(v??"").replace(/[^0-9,.-]/g,"");const n=Number(raw.replace(/\./g,"").replace(",","."));return Number.isFinite(n)?"$"+Math.round(n).toLocaleString("es-AR"):String(v??"")};
const productTitle=p=>p.subtitle?`${p.name} (${p.subtitle})`:p.name;
async function start(){
 db=supabase.createClient(EV_CONFIG.SUPABASE_URL,EV_CONFIG.SUPABASE_ANON_KEY);
 const {data,error}=await db.from("products").select("*").eq("active",true).order("id");
 if(error){$("app").innerHTML='<div class="msg">No se pudo cargar el catálogo.</div>';return}
 all=data||[]; shown=[...all]; fillCats(); render();
}
function fillCats(){const cats=[...new Set(all.map(p=>p.category).filter(Boolean))].sort();$("category").innerHTML='<option value="">Todas las categorías</option>'+cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")}
function filter(){const q=$("search").value.toLowerCase().trim(),c=$("category").value;shown=all.filter(p=>(!q||(`${p.name} ${p.subtitle} ${p.category}`).toLowerCase().includes(q))&&(!c||p.category===c));pos=0;render()}
$("search").addEventListener("input",filter);$("category").addEventListener("change",filter);
function render(){
 if(!shown.length){$("counter").textContent="0 / 0";$("app").innerHTML='<div class="msg">No se encontraron productos.</div>';return}
 pos=Math.max(0,Math.min(pos,shown.length-1));const p=shown[pos];$("counter").textContent=`${pos+1} / ${shown.length}`;
 $("app").innerHTML=`<div class="brand2">ELECTRO VARIETY</div><div class="tag">LA COMODIDAD PARA TU HOGAR</div>
 <h1 class="prodtitle">${esc(productTitle(p))}</h1>
 <img class="img" src="${esc(p.image_url)}" alt="${esc(productTitle(p))}"><div class="finance">
 <div class="row">${p.q_count} cuotas quincenales de <span class="value">${money(p.q_price)}</span></div>
 <div class="row">${p.m_count} cuotas mensuales de <span class="value">${money(p.m_price)}</span></div></div>
 <button class="share" onclick="share()">🟢 COMPARTIR POR WHATSAPP</button>
 <div class="nav"><button ${pos===0?"disabled":""} onclick="move(-1)">← Anterior</button><button ${pos===shown.length-1?"disabled":""} onclick="move(1)">Siguiente →</button></div>`;
}
function move(d){pos+=d;render();scrollTo({top:0,behavior:"smooth"})}
async function share(){
 const p=shown[pos];
 try{
   const res=await fetch(p.image_url,{mode:"cors"});
   if(!res.ok) throw new Error("No se pudo obtener la imagen");
   const blob=await res.blob();
   const ext=(blob.type&&blob.type.split("/")[1])||"jpg";
   const file=new File([blob],(p.name||"producto").replace(/[^a-z0-9]+/gi,"-").toLowerCase()+"."+ext,{type:blob.type||"image/jpeg"});
   const text=`${productTitle(p)}\n\n${p.q_count} cuotas quincenales de ${money(p.q_price)}\n${p.m_count} cuotas mensuales de ${money(p.m_price)}`;
   if(navigator.share&&navigator.canShare?.({files:[file]})){
     await navigator.share({title:p.name,text,files:[file]});
   }else if(navigator.share){
     await navigator.share({title:p.name,text});
   }else{
     alert("Abrí el catálogo en Chrome de Android para compartir por WhatsApp.");
   }
 }catch(e){
   if(e?.name!=="AbortError") alert("No se pudo preparar la ficha para compartir. Probá nuevamente.");
 }
}
start();
</script></body></html>
